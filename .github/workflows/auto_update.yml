name: KCI Auto Update Pipeline

on:
  schedule:
    # 매일 한국 시간 새벽 4시 (UTC 19시)에 자동 실행
    - cron: '0 19 * * *'
  workflow_dispatch: # 깃허브 웹사이트에서 수동으로 버튼을 눌러 실행할 수 있도록 허용

permissions:
  contents: write # 봇이 코드를 수정하고 푸시할 수 있는 권한 부여

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요한 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: KCI 신규 논문 수집 및 메타데이터 보완 (파이프라인 실행)
        run: |
          python discover_new_papers.py --auto-approve
          python enrich_and_rebuild.py
          python final_polish.py

      - name: 변경사항 확인 및 GitHub에 반영 (Commit & Push)
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 변경된 파일(데이터베이스 역할)이 있는지 확인
          if [[ -n $(git status -s index.html virtue_ethics_final_master_cleaned.csv) ]]; then
            git add index.html virtue_ethics_final_master_cleaned.csv
            git commit -m "🤖 Auto-update: KCI 신규 논문 자동 수집 및 대시보드 갱신"
            git push
            echo "업데이트가 성공적으로 반영되었습니다."
          else
            echo "새로운 논문이나 변경사항이 없습니다."
          fi
